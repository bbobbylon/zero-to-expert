# Build the site and publish it to GitHub Pages.
#
# Analogy: an Azure DevOps pipeline with two stages. "build" compiles and tests
# (here: validates every page's frontmatter and every internal link). "deploy"
# only runs if build passed, and publishes the artifact to an environment.
#
# Why these official GitHub actions instead of the one-step `withastro/action`:
# each step is visible here, so when something fails you can see exactly which
# stage broke. Action versions were the latest major tags on 2026-09-18.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]      # every push to main rebuilds and redeploys
  workflow_dispatch:      # "Run workflow" button in the Actions tab, for manual redeploys

# Least privilege: read the code, write to Pages, and mint the OIDC token
# that deploy-pages uses to prove the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits instead of cancelling a
# deployment halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc   # same Node major locally and in CI
          cache: npm                  # reuse downloaded packages between runs

      # Asks GitHub where this Pages site will live. For a project repo that is
      # origin "https://<user>.github.io" and base_path "/<repo>"; with a custom
      # domain, base_path is "". astro.config.mjs reads both as env vars.
      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v6

      # Same entry point you use locally, so CI and your machine can't drift apart.
      # `bash run.sh` (not ./run.sh) works even if the executable bit was lost on Windows.
      - name: Check tools and install exact dependency versions
        run: bash run.sh setup

      # Fails (and stops the deploy) on invalid frontmatter or any broken link.
      # When a backend/ is added, also add actions/setup-java before this step.
      - name: Build and validate
        run: bash run.sh build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}   # shown as a link on the run page
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
