<!doctype html>
<!--
  Source for public/og.png — the 1200×630 image that link previews (Slack, Discord, iMessage,
  LinkedIn, X) show when someone shares a page of the site. `astro.config.mjs` points the
  og:image meta tag at the PNG.

  Link-preview scrapers do not render SVG or HTML, so the PNG is committed. To regenerate it
  after a design change: run `./run.sh setup` (the fonts load from node_modules), open this
  file in a browser window sized to exactly 1200×630 CSS pixels (or use a headless browser's
  screenshot command at that size), and save the capture as public/og.png.

  It is the manual's cover at postcard size: running head, title, the registration mark, one
  rule. Colours and fonts mirror src/styles/theme.css (dark theme). Keep them in sync by hand;
  this file is outside the build on purpose so it can never affect the site.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zero to Expert — share image source</title>
    <style>
      @font-face {
        font-family: 'Barlow Condensed';
        src: url('../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2') format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2') format('woff2');
        font-weight: 600;
      }
      html,
      body {
        margin: 0;
      }
      body {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        padding: 56px 72px;
        background: #15171a;
        color: #cfccc1;
        font-family: system-ui, 'Segoe UI', sans-serif;
      }
      .running-head {
        display: flex;
        gap: 56px;
        margin: 0;
        padding: 18px 0;
        border-top: 2px solid #33373d;
        border-bottom: 2px solid #33373d;
        color: #9d9a90;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .running-head .lead {
        color: #f2c200;
      }
      .body {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-top: 36px;
      }
      h1 {
        margin: 0;
        color: #faf7ee;
        font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        font-size: 156px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 0.88;
        text-transform: uppercase;
      }
      .mark {
        width: 150px;
        height: 150px;
        margin-top: 8px;
      }
      .tagline {
        margin: 24px 0 0;
        max-width: 720px;
        color: #ebe8de;
        font-size: 30px;
        line-height: 1.3;
      }
      .rule {
        position: absolute;
        inset: auto 72px 56px;
        height: 4px;
        background: #ebe8de;
      }
    </style>
  </head>
  <body>
    <p class="running-head">
      <span class="lead">Field guides</span>
      <span>Tech · Trades · Survival</span>
      <span>Every page stamped</span>
    </p>
    <div class="body">
      <h1>Zero to<br />Expert</h1>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" fill="#f2c200" />
        <g fill="none" stroke="#161512" stroke-width="3">
          <circle cx="32" cy="32" r="14" />
          <path d="M32 8v48M8 32h48" />
        </g>
      </svg>
    </div>
    <p class="tagline">From first steps to mastery. Every page says whether it has been fact-checked.</p>
    <div class="rule"></div>
  </body>
</html>
